<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nova Core — AI Academic Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(145deg, #eef2f9 0%, #e2e8f2 100%);
    min-height: 100vh;
    color: #1a2c3e;
  }

  /* Glassmorphism Nav */
  .glass-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(52, 152, 219, 0.2);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
  }

  .nav-container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0.8rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, #2c3e50, #3498db);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: white;
    box-shadow: 0 8px 18px rgba(52, 152, 219, 0.25);
  }

  .logo-text {
    font-weight: 800;
    font-size: 1.35rem;
    letter-spacing: -0.3px;
    background: linear-gradient(135deg, #1e2f3f, #2c3e50);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  .logo-badge {
    font-size: 0.65rem;
    font-weight: 600;
    background: #3498db10;
    padding: 4px 8px;
    border-radius: 40px;
    color: #3498db;
    border: 1px solid #3498db20;
  }

  .nav-tabs {
    display: flex;
    gap: 6px;
    background: #f0f4fa;
    padding: 4px;
    border-radius: 60px;
  }

  .nav-btn {
    background: transparent;
    border: none;
    padding: 8px 18px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #4a627a;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-btn i {
    font-size: 0.9rem;
  }

  .nav-btn.active {
    background: white;
    color: #2c3e50;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(52, 152, 219, 0.2);
  }

  .status-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #eef2fa;
    padding: 6px 14px;
    border-radius: 40px;
    font-size: 0.75rem;
    font-weight: 500;
    color: #2c6b2f;
  }

  .pulse {
    width: 8px;
    height: 8px;
    background: #2ecc71;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.5);
    animation: pulse-green 1.8s infinite;
  }

  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
  }

  /* Main Layout */
  .main {
    max-width: 1300px;
    margin: 1.8rem auto;
    padding: 0 2rem;
  }

  .page {
    display: none;
    animation: fadeUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
  }

  .page.active {
    display: block;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Headers */
  .section-header {
    margin-bottom: 1.6rem;
  }

  .section-header h2 {
    font-size: 1.7rem;
    font-weight: 700;
    background: linear-gradient(125deg, #1a2c3e, #2c3e50);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
  }

  .section-header p {
    color: #5d7184;
    font-weight: 500;
    margin-top: 6px;
  }

  /* Cards */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2rem;
  }

  .stat-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 1.2rem 1.2rem;
    border: 1px solid rgba(52, 152, 219, 0.15);
    transition: all 0.2s;
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.02);
  }

  .stat-card:hover {
    transform: translateY(-3px);
    border-color: #3498db40;
    background: white;
  }

  .stat-icon {
    background: #eef2ff;
    width: 46px;
    height: 46px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: #3498db;
    margin-bottom: 0.9rem;
  }

  .stat-value {
    font-size: 2.1rem;
    font-weight: 800;
    color: #1e2f3f;
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6c86a0;
    margin-top: 6px;
  }

  /* Platform Cards */
  .platform-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .platform-card {
    background: white;
    border-radius: 24px;
    padding: 1.2rem 0.8rem;
    text-align: center;
    border: 1px solid #e9edf2;
    transition: all 0.2s;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }

  .platform-card.connected {
    border-color: #3498db;
    background: #f8fdff;
  }

  .platform-icon {
    font-size: 2rem;
    margin-bottom: 10px;
  }

  /* Buttons */
  .btn-primary {
    background: #1e2f3f;
    border: none;
    padding: 0.7rem 1.5rem;
    border-radius: 40px;
    font-weight: 600;
    color: white;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 0.85rem;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  }

  .btn-primary:hover {
    background: #2c3e50;
    transform: scale(0.98);
  }

  /* AI Log */
  .ai-log {
    background: #0f1724;
    border-radius: 20px;
    padding: 1rem;
    font-family: 'Menlo', monospace;
    font-size: 0.75rem;
    color: #b7cdff;
    height: 160px;
    overflow-y: auto;
  }

  /* Calendar */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    background: white;
    border-radius: 28px;
    padding: 1rem;
  }

  .cal-day {
    background: #f9fbfd;
    border-radius: 16px;
    padding: 0.6rem;
    min-height: 100px;
    border: 1px solid #eef2f8;
  }

  /* Toast */
  .toast-stack {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: #1e2f3f;
    color: white;
    padding: 12px 20px;
    border-radius: 60px;
    font-size: 0.8rem;
    font-weight: 500;
    backdrop-filter: blur(12px);
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(40px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* Responsive */
  @media (max-width: 800px) {
    .nav-container {
      flex-direction: column;
      align-items: stretch;
    }
    .cal-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }
</style>
</head>
<body>

<div class="glass-nav">
  <div class="nav-container">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-brain"></i></div>
      <div>
        <span class="logo-text">Nova Core</span>
        <div class="logo-badge">AI ACADEMIC HUB</div>
      </div>
    </div>
    <div class="nav-tabs" id="navTabs">
      <button class="nav-btn active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
      <button class="nav-btn" data-page="platforms"><i class="fas fa-plug"></i> Platforms</button>
      <button class="nav-btn" data-page="calendar"><i class="fas fa-calendar-alt"></i> Calendar</button>
      <button class="nav-btn" data-page="tasks"><i class="fas fa-check-circle"></i> Tasks</button>
      <button class="nav-btn" data-page="admin"><i class="fas fa-shield-alt"></i> Admin</button>
    </div>
    <div class="status-chip">
      <div class="pulse"></div>
      <span>AI Online · Real-time Sync</span>
    </div>
  </div>
</div>

<main class="main" id="appRoot">
  <!-- DYNAMIC CONTENT WILL BE RENDERED HERE -->
</main>

<div class="toast-stack" id="toastContainer"></div>

<script>
  // ---------- SIMPLE STATE ----------
  let activePage = 'dashboard';
  let platforms = [
    { id: 'gmail', name: 'Gmail', icon: 'fab fa-google', connected: false, type: 'email' },
    { id: 'outlook', name: 'Outlook', icon: 'fab fa-microsoft', connected: false, type: 'email' },
    { id: 'moodle', name: 'Moodle', icon: 'fas fa-graduation-cap', connected: false, type: 'lms' },
    { id: 'canvas', name: 'Canvas', icon: 'fas fa-palette', connected: false, type: 'lms' },
    { id: 'telegram', name: 'Telegram', icon: 'fab fa-telegram', connected: false, type: 'social' }
  ];

  let deadlines = [
    { id: 1, name: 'AI Research Paper', source: 'gmail', due: 'Jun 12', details: 'Submit via email to professor' },
    { id: 2, name: 'Calculus Exam Prep', source: 'moodle', due: 'Jun 14', details: 'Review chapters 5-7' },
    { id: 3, name: 'Team Sync', source: 'telegram', due: 'Jun 10', details: 'Discuss final project' }
  ];

  let tasks = [
    { id: 1, name: 'Write Introduction', source: 'Canvas', due: 'Jun 11', done: false, archived: false },
    { id: 2, name: 'Review Literature', source: 'Moodle', due: 'Jun 13', done: false, archived: false }
  ];

  // Helper: Toast
  function showToast(msg, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}" style="margin-right: 8px;"></i> ${msg}`;
    document.getElementById('toastContainer').appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // Render Functions
  function renderDashboard() {
    const connectedCount = platforms.filter(p => p.connected).length;
    const upcoming = deadlines.length;
    const completedTasks = tasks.filter(t => t.done).length;
    return `
      <div class="section-header">
        <h2>Control Center</h2>
        <p>Your academic ecosystem, unified.</p>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-plug"></i></div><div class="stat-value">${connectedCount}</div><div class="stat-label">Platforms Connected</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-week"></i></div><div class="stat-value">${upcoming}</div><div class="stat-label">Upcoming Deadlines</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-double"></i></div><div class="stat-value">${completedTasks}</div><div class="stat-label">Tasks Completed</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-microchip"></i></div><div class="stat-value">AI</div><div class="stat-label">Active Inference</div></div>
      </div>
      <div style="background: white; border-radius: 28px; padding: 1.5rem; margin-top: 0.5rem;">
        <h3 style="font-weight: 700; margin-bottom: 1rem;">✨ AI Insight</h3>
        <p style="color: #2c3e50;">Based on your workload, focus on <strong>AI Research Paper</strong> — due in 2 days. Nova Core recommends 2h session today.</p>
        <button class="btn-primary" onclick="switchPage('tasks')" style="margin-top: 1rem;"><i class="fas fa-rocket"></i> Go to Tasks</button>
      </div>
    `;
  }

  function renderPlatforms() {
    return `
      <div class="section-header"><h2>Connect Platforms</h2><p>Link your academic tools, one click.</p></div>
      <div class="platform-grid">
        ${platforms.map(p => `
          <div class="platform-card ${p.connected ? 'connected' : ''}" onclick="toggleConnect('${p.id}')">
            <div class="platform-icon"><i class="${p.icon}"></i></div>
            <strong>${p.name}</strong>
            <div style="font-size: 0.7rem; margin-top: 6px;">${p.connected ? '✅ Connected' : '⚪ Disconnected'}</div>
          </div>
        `).join('')}
      </div>
      <div style="display: flex; justify-content: center; margin-top: 1rem;">
        <button class="btn-primary" id="globalFetchBtn"><i class="fas fa-microchip"></i> Run AI Fetch</button>
      </div>
    `;
  }

  function renderCalendar() {
    return `
      <div class="section-header"><h2>Unified Calendar</h2><p>Color-coded by source: Email · LMS · Social</p></div>
      <div style="background: white; border-radius: 32px; padding: 1rem;">
        <div class="cal-grid">
          ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => `<div style="font-weight: 700;">${day}</div>`).join('')}
          ${deadlines.map(d => `<div class="cal-day"><strong>${d.name}</strong><br><span style="font-size: 0.7rem;">${d.due}</span></div>`).join('')}
          ${Array(7 - deadlines.length).fill('<div class="cal-day">—</div>').join('')}
        </div>
      </div>
    `;
  }

  function renderTasks() {
    const activeTasks = tasks.filter(t => !t.archived);
    return `
      <div class="section-header"><h2>Task Manager</h2><p>Track, complete, archive.</p></div>
      ${activeTasks.map(t => `
        <div style="background: white; border-radius: 20px; padding: 1rem; margin-bottom: 0.7rem; display: flex; justify-content: space-between; align-items: center;">
          <div><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})"> <strong>${t.name}</strong> <span style="color: gray;">· ${t.source}</span></div>
          <div><button class="btn-primary" style="padding: 0.3rem 1rem;" onclick="archiveTask(${t.id})">Archive</button></div>
        </div>
      `).join('')}
    `;
  }

  function renderAdmin() {
    return `
      <div class="section-header"><h2>Admin Dashboard</h2><p>System health & security.</p></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-database"></i></div><div class="stat-value">99.9%</div><div class="stat-label">Uptime</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-shield-virus"></i></div><div class="stat-value">OK</div><div class="stat-label">Security Audit</div></div>
      </div>
      <button class="btn-primary" onclick="runSecurity()"><i class="fas fa-shield-alt"></i> Run Security Check</button>
      <button class="btn-primary" style="margin-left: 12px;" onclick="runBackup()"><i class="fas fa-cloud-upload-alt"></i> Backup Now</button>
      <div style="margin-top: 2rem; background: #0f1724; border-radius: 24px; padding: 1rem; color: white;">
        <i class="fas fa-terminal"></i> System Log: <span id="adminLogMsg">All systems operational.</span>
      </div>
    `;
  }

  // Global actions
  window.toggleConnect = (id) => {
    const p = platforms.find(p => p.id === id);
    p.connected = !p.connected;
    showToast(`${p.name} ${p.connected ? 'connected' : 'disconnected'}`, 'success');
    refreshUI();
  };

  window.toggleTask = (id) => {
    const task = tasks.find(t => t.id === id);
    task.done = !task.done;
    refreshUI();
  };

  window.archiveTask = (id) => {
    const task = tasks.find(t => t.id === id);
    task.archived = true;
    showToast(`Archived: ${task.name}`, 'info');
    refreshUI();
  };

  window.runSecurity = () => {
    showToast('Security check passed — no threats', 'success');
    const logSpan = document.getElementById('adminLogMsg');
    if (logSpan) logSpan.innerText = '[SEC] Audit passed at ' + new Date().toLocaleTimeString();
  };

  window.runBackup = () => {
    showToast('Cloud backup completed', 'success');
  };

  window.switchPage = (page) => {
    activePage = page;
    refreshUI();
    document.querySelectorAll('.nav-btn').forEach(btn => {
      if (btn.dataset.page === page) btn.classList.add('active');
      else btn.classList.remove('active');
    });
  };

  function refreshUI() {
    const root = document.getElementById('appRoot');
    if (activePage === 'dashboard') root.innerHTML = renderDashboard();
    if (activePage === 'platforms') root.innerHTML = renderPlatforms();
    if (activePage === 'calendar') root.innerHTML = renderCalendar();
    if (activePage === 'tasks') root.innerHTML = renderTasks();
    if (activePage === 'admin') root.innerHTML = renderAdmin();

    // reattach global fetch if needed
    const fetchBtn = document.getElementById('globalFetchBtn');
    if (fetchBtn) {
      fetchBtn.onclick = () => {
        showToast('AI Fetch: scanning platforms...', 'info');
        setTimeout(() => showToast('Found 3 new deadlines', 'success'), 1000);
      };
    }
  }

  // Attach nav listeners
  function bindNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchPage(btn.dataset.page);
      });
    });
  }

  // Initial render
  refreshUI();
  bindNav();

  // Extra: add a demo AI fetch effect on console
  console.log('🚀 Nova Core Frontend — Ready to impress');
</script>
</body>
</html>
