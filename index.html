<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nova Core · AI Academic Hub | Never Miss a Deadline</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #f0f4fa, #e6edf6);
            min-height: 100vh;
            color: #1a2c3e;
        }

        /* Modern Glass Navigation */
        .glass-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(52, 152, 219, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #1e2f3f, #2c3e50);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.25);
        }

        .logo-text {
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #1a2c3e, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 60px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a627a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn.active {
            background: white;
            color: #2c3e50;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 0 0 1px #3498db30;
        }

        .status-chip {
            background: #eef2fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2c6b2f;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.5); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .main {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page {
            display: none;
            animation: fadeSlide 0.35s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Headers */
        .section-header {
            margin-bottom: 2rem;
        }

        .section-header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(125deg, #1a2c3e, #2c3e50);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 1.3rem;
            border: 1px solid rgba(52, 152, 219, 0.15);
            transition: all 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: white;
            border-color: #3498db40;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: #eef2ff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #3498db;
            margin-bottom: 1rem;
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #1a2c3e;
        }

        /* Platform Grid */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin: 1.5rem 0;
        }

        .platform-card {
            background: white;
            border-radius: 24px;
            padding: 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #edf2f7;
        }

        .platform-card.connected {
            border: 2px solid #3498db;
            background: #f8fdff;
        }

        .platform-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .btn-primary, .btn-outline {
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #1e2f3f;
            color: white;
        }

        .btn-primary:hover {
            background: #2c3e50;
            transform: scale(0.97);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #3498db;
            color: #3498db;
        }

        /* AI Log */
        .ai-log {
            background: #0f1724;
            border-radius: 24px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.75rem;
            color: #b7cdff;
            height: 160px;
            overflow-y: auto;
        }

        /* Calendar */
        .calendar-wrapper {
            background: white;
            border-radius: 32px;
            padding: 1.2rem;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .cal-day {
            background: #f9fbfd;
            border-radius: 18px;
            padding: 0.7rem;
            min-height: 100px;
            border: 1px solid #eef2f8;
        }

        /* Tasks */
        .task-item {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toast */
        .toast-area {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: #1e2f3f;
            color: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            animation: slideIn 0.2s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(60px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 700px) {
            .nav-container {
                flex-direction: column;
            }
            .cal-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="glass-nav">
    <div class="nav-container">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-microchip"></i></div>
            <span class="logo-text">NOVA CORE</span>
        </div>
        <div class="nav-tabs" id="navTabs">
            <button class="nav-btn active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
            <button class="nav-btn" data-page="platforms"><i class="fas fa-plug"></i> Platforms</button>
            <button class="nav-btn" data-page="calendar"><i class="fas fa-calendar-alt"></i> Calendar</button>
            <button class="nav-btn" data-page="tasks"><i class="fas fa-tasks"></i> Tasks</button>
            <button class="nav-btn" data-page="admin"><i class="fas fa-shield-alt"></i> Admin</button>
        </div>
        <div class="status-chip"><div class="pulse-dot"></div> AI Active · Real-time</div>
    </div>
</div>

<main class="main" id="app"></main>
<div class="toast-area" id="toastRoot"></div>

<script>
    // ---------- State ----------
    let platforms = [
        { id: 'gmail', name: 'Gmail', icon: 'fab fa-google', connected: false, color: '#ea4335' },
        { id: 'outlook', name: 'Outlook', icon: 'fab fa-microsoft', connected: false, color: '#0078d4' },
        { id: 'moodle', name: 'Moodle', icon: 'fas fa-graduation-cap', connected: false, color: '#f98012' },
        { id: 'canvas', name: 'Canvas', icon: 'fas fa-chalkboard', connected: false, color: '#e66000' },
        { id: 'telegram', name: 'Telegram', icon: 'fab fa-telegram', connected: false, color: '#2ca5e0' }
    ];

    let deadlines = [
        { id: 1, name: 'AI Research Paper', source: 'gmail', due: 'Jun 12', details: 'Final draft submission' },
        { id: 2, name: 'Calculus Exam', source: 'moodle', due: 'Jun 14', details: 'Chapters 5-8' },
        { id: 3, name: 'Team Sync Meeting', source: 'telegram', due: 'Jun 10', details: 'Discuss prototype' }
    ];

    let tasks = [
        { id: 1, name: 'Write Introduction', source: 'Canvas', due: 'Jun 11', done: false, archived: false },
        { id: 2, name: 'Review Literature', source: 'Moodle', due: 'Jun 13', done: false, archived: false }
    ];

    let aiLogs = ['🟢 Nova Core AI initialized', '📡 Waiting for platform connections'];
    let adminLogs = ['✅ System boot v2.4.0', '🔒 Security modules loaded'];

    // Helpers
    function showToast(msg, type = 'info') {
        const toastDiv = document.getElementById('toastRoot');
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
        toastDiv.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function addAiLog(msg) {
        aiLogs.unshift(msg);
        if (aiLogs.length > 6) aiLogs.pop();
        if (document.getElementById('aiLogBox')) {
            document.getElementById('aiLogBox').innerHTML = aiLogs.map(l => `<div style="padding:2px 0">> ${l}</div>`).join('');
        }
    }

    function addAdminLog(msg) {
        adminLogs.unshift(msg);
        if (adminLogs.length > 5) adminLogs.pop();
        if (document.getElementById('adminLogBox')) {
            document.getElementById('adminLogBox').innerHTML = adminLogs.map(l => `<div style="padding:2px 0">${l}</div>`).join('');
        }
    }

    // Core action: AI Fetch
    function runAIFetch() {
        const connected = platforms.filter(p => p.connected).length;
        if (connected === 0) {
            showToast('Connect at least one platform first', 'warning');
            return;
        }

        addAiLog('🤖 AI Fetch started — scanning connected platforms...');
        showToast('AI Fetch: scanning deadlines...', 'info');

        setTimeout(() => {
            const newFound = deadlines.filter(d => platforms.find(p => p.id === d.source && p.connected));
            addAiLog(`✅ Found ${newFound.length} active deadlines synced to Calendar.`);
            showToast(`AI Fetch complete: ${newFound.length} deadlines updated`, 'success');
            if (document.getElementById('dashboardUpcoming')) {
                document.getElementById('dashboardUpcoming').innerText = newFound.length;
            }
            renderCurrentPage();
        }, 1500);
    }

    // Platform toggle
    function togglePlatform(id) {
        const p = platforms.find(p => p.id === id);
        p.connected = !p.connected;
        addAiLog(`${p.connected ? '🔌 Connected' : '❌ Disconnected'} ${p.name}`);
        showToast(`${p.name} ${p.connected ? 'connected' : 'disconnected'}`, p.connected ? 'success' : 'info');
        renderCurrentPage();
    }

    // Task actions
    function toggleTaskDone(id) {
        const task = tasks.find(t => t.id === id);
        task.done = !task.done;
        showToast(task.done ? '✅ Task completed' : 'Task marked incomplete', 'info');
        renderCurrentPage();
    }

    function archiveTask(id) {
        const task = tasks.find(t => t.id === id);
        task.archived = true;
        showToast(`📦 Archived: ${task.name}`, 'success');
        renderCurrentPage();
    }

    // Security + Backup
    function runSecurityCheck() {
        addAdminLog('🔒 Running security audit...');
        showToast('Security check in progress...', 'info');
        setTimeout(() => {
            addAdminLog('✅ Security audit passed — all tokens valid, no threats.');
            showToast('Security check passed!', 'success');
            if (document.getElementById('secResult')) document.getElementById('secResult').innerHTML = '✅ Last scan: All secure';
        }, 1200);
    }

    function runBackup() {
        addAdminLog('💾 Initiating full cloud backup...');
        showToast('Backup started...', 'info');
        setTimeout(() => {
            const time = new Date().toLocaleTimeString();
            addAdminLog(`✅ Backup completed at ${time} — 2.3MB stored`);
            showToast('Backup completed successfully', 'success');
            if (document.getElementById('lastBackup')) document.getElementById('lastBackup').innerText = time;
        }, 1400);
    }

    // Rendering engine
    function renderDashboard() {
        const connectedCount = platforms.filter(p => p.connected).length;
        const upcoming = deadlines.filter(d => platforms.find(p => p.id === d.source && p.connected)).length;
        const completed = tasks.filter(t => t.done && !t.archived).length;
        return `
            <div class="section-header"><h1>Control Center</h1></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-plug"></i></div><div class="stat-number" id="dashboardConnected">${connectedCount}</div><div>Platforms Connected</div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-day"></i></div><div class="stat-number" id="dashboardUpcoming">${upcoming}</div><div>Upcoming Deadlines</div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-double"></i></div><div class="stat-number">${completed}</div><div>Tasks Completed</div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-microchip"></i></div><div class="stat-number">AI</div><div>Active Inference</div></div>
            </div>
            <div style="background: white; border-radius: 28px; padding: 1.5rem;">
                <h3 style="font-weight: 800;">🧠 AI Assistant Insight</h3>
                <p style="margin-top: 0.5rem;">Your next priority: <strong>AI Research Paper</strong> due in 2 days. Nova Core suggests 2h focus session.</p>
                <button class="btn-primary" style="margin-top: 1rem;" onclick="switchPage('tasks')"><i class="fas fa-arrow-right"></i> View Tasks</button>
            </div>
        `;
    }

    function renderPlatforms() {
        return `
            <div class="section-header"><h1>Connect Platforms</h1></div>
            <div class="platform-grid">
                ${platforms.map(p => `
                    <div class="platform-card ${p.connected ? 'connected' : ''}" onclick="togglePlatform('${p.id}')">
                        <div class="platform-icon"><i class="${p.icon}" style="color:${p.color}"></i></div>
                        <strong>${p.name}</strong>
                        <div style="font-size:0.7rem;margin-top:6px;">${p.connected ? '✅ Connected' : '⚪ Disconnected'}</div>
                    </div>
                `).join('')}
            </div>
            <div style="display:flex; justify-content:center; gap:1rem; margin-top:1rem;">
                <button class="btn-primary" onclick="runAIFetch()"><i class="fas fa-microchip"></i> Run AI Fetch</button>
            </div>
            <div class="ai-log" id="aiLogBox" style="margin-top: 1.5rem;">
                ${aiLogs.map(l => `<div>> ${l}</div>`).join('')}
            </div>
        `;
    }

    function renderCalendar() {
        const connectedDeadlines = deadlines.filter(d => platforms.find(p => p.id === d.source && p.connected));
        return `
            <div class="section-header"><h1>Unified Calendar</h1></div>
            <div class="calendar-wrapper">
                <div class="cal-grid">
                    ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => `<div style="font-weight:700;">${day}</div>`).join('')}
                    ${connectedDeadlines.map(d => `<div class="cal-day"><strong>${d.name}</strong><br><span style="font-size:0.7rem;">${d.due}</span></div>`).join('')}
                    ${Array(Math.max(0, 7 - connectedDeadlines.length)).fill('<div class="cal-day">—</div>').join('')}
                </div>
            </div>
        `;
    }

    function renderTasks() {
        const activeTasks = tasks.filter(t => !t.archived);
        return `
            <div class="section-header"><h1>Task Manager</h1></div>
            ${activeTasks.map(t => `
                <div class="task-item">
                    <div><input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTaskDone(${t.id})"> <strong>${t.name}</strong> <span style="color:#6c86a0; font-size:0.8rem;">· ${t.source}</span></div>
                    <button class="btn-outline" style="padding:0.3rem 1rem;" onclick="archiveTask(${t.id})"><i class="fas fa-archive"></i> Archive</button>
                </div>
            `).join('')}
            <div class="ai-log" style="margin-top: 1rem; background:#eef2fa; color:#1e2f3f;">
                📌 Tip: Completed tasks can be archived to keep your list clean.
            </div>
        `;
    }

    function renderAdmin() {
        return `
            <div class="section-header"><h1>Admin Dashboard</h1></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-database"></i></div><div class="stat-number">99.9%</div><div>Uptime SLA</div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-shield-virus"></i></div><div class="stat-number">OK</div><div>Security Posture</div></div>
            </div>
            <div style="display:flex; gap:1rem; margin-bottom:1.5rem;">
                <button class="btn-primary" onclick="runSecurityCheck()"><i class="fas fa-shield-alt"></i> Run Security Check</button>
                <button class="btn-primary" onclick="runBackup()"><i class="fas fa-cloud-upload-alt"></i> Backup Now</button>
            </div>
            <div id="secResult" style="margin-bottom:1rem; font-size:0.85rem;">🔐 Last security check: pending</div>
            <div id="lastBackup" style="margin-bottom:1rem;">💾 Last backup: never</div>
            <div class="ai-log" id="adminLogBox" style="height:140px;">
                ${adminLogs.map(l => `<div>${l}</div>`).join('')}
            </div>
        `;
    }

    let currentPage = 'dashboard';

    function renderCurrentPage() {
        const appDiv = document.getElementById('app');
        if (currentPage === 'dashboard') appDiv.innerHTML = renderDashboard();
        if (currentPage === 'platforms') appDiv.innerHTML = renderPlatforms();
        if (currentPage === 'calendar') appDiv.innerHTML = renderCalendar();
        if (currentPage === 'tasks') appDiv.innerHTML = renderTasks();
        if (currentPage === 'admin') appDiv.innerHTML = renderAdmin();

        // update stats if needed
        if (currentPage === 'dashboard') {
            const connected = platforms.filter(p => p.connected).length;
            const upcoming = deadlines.filter(d => platforms.find(p => p.id === d.source && p.connected)).length;
            const dbConn = document.getElementById('dashboardConnected');
            const dbUp = document.getElementById('dashboardUpcoming');
            if (dbConn) dbConn.innerText = connected;
            if (dbUp) dbUp.innerText = upcoming;
        }
        if (currentPage === 'platforms' && document.getElementById('aiLogBox')) {
            document.getElementById('aiLogBox').innerHTML = aiLogs.map(l => `<div>> ${l}</div>`).join('');
        }
        if (currentPage === 'admin' && document.getElementById('adminLogBox')) {
            document.getElementById('adminLogBox').innerHTML = adminLogs.map(l => `<div>${l}</div>`).join('');
        }
    }

    window.switchPage = (page) => {
        currentPage = page;
        renderCurrentPage();
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.page === page) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    };

    window.togglePlatform = togglePlatform;
    window.toggleTaskDone = toggleTaskDone;
    window.archiveTask = archiveTask;
    window.runAIFetch = runAIFetch;
    window.runSecurityCheck = runSecurityCheck;
    window.runBackup = runBackup;

    // Initial render + event binding
    renderCurrentPage();
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => switchPage(btn.dataset.page));
    });
    addAiLog('🚀 Nova Core AI engine ready — connect platforms to begin.');
    addAdminLog('🖥️ Admin interface loaded — all systems nominal.');
</script>
</body>
</html>
